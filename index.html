<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Gestor de Gastos Personales</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <section id="login-screen" class="screen">
    <form id="login-form" class="card">
      <h1>Gestor de Gastos</h1>
      <p>Inicia sesión para continuar</p>
      <input type="text" id="login-user" placeholder="Usuario" required>
      <input type="password" id="login-pass" placeholder="Contraseña" required>
      <button type="submit">Entrar</button>
      <p id="login-error" class="error"></p>
      <small>Usuario: admin / Contraseña: 1234</small>
    </form>
  </section>

  <section id="app-screen" class="screen" style="display:none">
    <header>
      <h1>Mis Gastos</h1>
      <button id="logout-btn">Cerrar sesión</button>
    </header>

    <form id="expense-form" class="card">
      <h2>Agregar gasto</h2>
      <input type="hidden" id="expense-id">
      <input type="text" id="expense-desc" placeholder="Descripción" required>
      <input type="number" id="expense-amount" placeholder="Monto" step="0.01" required>
      <select id="expense-category" required>
        <option value="">Categoría</option>
        <option value="Comida">Comida</option>
        <option value="Transporte">Transporte</option>
        <option value="Vivienda">Vivienda</option>
        <option value="Entretenimiento">Entretenimiento</option>
        <option value="Otros">Otros</option>
      </select>
      <input type="date" id="expense-date" required>
      <button type="submit" id="expense-submit-btn">Agregar</button>
      <button type="button" id="expense-cancel-btn" style="display:none">Cancelar edición</button>
    </form>

    <div class="card">
      <h2>Historial de gastos</h2>
      <p>Total gastado: <strong id="expense-total">$0.00</strong></p>
      <table id="expense-table">
        <thead>
          <tr>
            <th>Descripción</th>
            <th>Monto</th>
            <th>Categoría</th>
            <th>Fecha</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="expense-table-body"></tbody>
      </table>
      <p id="expense-empty" style="display:none">No hay gastos registrados todavía.</p>
    </div>
  </section>

  <script src="app.js"></script>
</body>
</html>
